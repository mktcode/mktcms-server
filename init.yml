#cloud-config
package_update: true
package_upgrade: true

packages:
  - nginx
  - supervisor
  - curl
  - ca-certificates
  - xz-utils
  - git
  - certbot
  - python3-certbot-nginx
  - fail2ban
  - vim

users:
  - default
  - name: websites
    system: true
    home: /var/www/websites
    shell: /bin/bash
    create_home: true
    lock_passwd: true

write_files:
  - path: /etc/fail2ban/jail.d/sshd.local
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      bantime  = 24h
      findtime = 10m
  - path: /etc/fail2ban/filter.d/nginx-php-probe.conf
    permissions: "0644"
    content: |
      [Definition]
      failregex = ^<HOST> - .* "(GET|POST).*\.php.*HTTP.*" (404|301|403)
      ignoreregex =
  - path: /etc/fail2ban/jail.d/nginx-php-probe.local
    permissions: "0644"
    content: |
      [nginx-php-probe]
      enabled  = true
      filter   = nginx-php-probe
      logpath  = /var/log/nginx/access.log
      port     = http,https
      findtime = 600
      maxretry = 5
      bantime  = 86400

runcmd:
  # Set timezone
  - timedatectl set-timezone Europe/Berlin

  # Generate root SSH key
  - ssh-keygen -t ed25519 -a 100 -N '' -f /root/.ssh/id_ed25519

  # Create app and log directories
  - install -d -o websites -g websites /var/www/websites
  - install -d -o websites -g websites /var/log/websites

  # Node.js global – Version: 24.12.0 (LTS)
  - ARCH=$(uname -m)
  - |
    if [ "$ARCH" = "x86_64" ]; then
      NODE_ARCH="x64"
    elif [ "$ARCH" = "aarch64" ]; then
      NODE_ARCH="arm64"
    else
      echo "Unsupported architecture: $ARCH"
      exit 1
    fi
  - curl -fsSL https://nodejs.org/dist/v24.12.0/node-v24.12.0-linux-${NODE_ARCH}.tar.xz -o /tmp/node.tar.xz
  - tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
  - rm -f /tmp/node.tar.xz

  # Start and enable services
  - systemctl enable --now nginx
  - systemctl enable --now supervisor
  - systemctl enable --now fail2ban

  # Clone mktcms-server and add CLI to PATH for root
  - git clone https://github.com/mktcode/mktcms-server.git /root/mktcms-server
  - echo 'export PATH=$PATH:/root/mktcms-server/cli' >> /root/.bashrc